<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情报采集控制台</title>
  <style>
    :root {
      --ink: #20231f;
      --muted: #666c64;
      --line: #d9ddd6;
      --surface: #ffffff;
      --wash: #f4f6f2;
      --green: #1f6b4f;
      --green-hover: #195740;
      --amber: #b46716;
      --red: #aa3d32;
      --focus: #2d7258;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    button, input, select { min-height: 38px; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(45, 114, 88, .22);
      outline-offset: 1px;
    }
    .topbar {
      height: 58px;
      background: #272b27;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 3px solid #d19b3d;
    }
    .brand { font-size: 18px; font-weight: 700; }
    .health { color: #d7ddd6; font-size: 13px; }
    .health::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #6eca99;
    }
    main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 48px; }
    .collect-band {
      display: grid;
      grid-template-columns: 180px minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding-bottom: 22px;
    }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      border: 1px solid #bfc5bc;
      border-radius: 5px;
      background: white;
      color: var(--ink);
      padding: 8px 10px;
    }
    #query { height: 44px; font-size: 16px; }
    .primary, .secondary {
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      padding: 0 18px;
      font-weight: 700;
    }
    .primary { height: 44px; background: var(--green); color: white; }
    .primary:hover { background: var(--green-hover); }
    .primary:disabled { background: #89958e; cursor: wait; }
    .secondary { border: 1px solid #bfc5bc; background: white; color: var(--ink); }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0 10px;
    }
    h2 { margin: 0; font-size: 17px; }
    .hint, .save-state { color: var(--muted); font-size: 12px; }
    .source-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--line);
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .source {
      min-width: 0;
      background: var(--surface);
      padding: 16px;
    }
    .source-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .source-name { font-weight: 700; font-size: 15px; }
    .source-table { color: var(--muted); font-family: Consolas, monospace; font-size: 11px; overflow-wrap: anywhere; margin: 5px 0 14px; }
    .source-fields { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: #a9afa8; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: white; transition: .15s; }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 18px; margin-top: 24px; }
    .panel { min-width: 0; background: white; border: 1px solid var(--line); border-radius: 6px; }
    .panel-title { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel-title strong { font-size: 14px; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; }
    .tab { min-height: 32px; white-space: nowrap; border: 0; background: transparent; padding: 5px 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--green); border-color: var(--green); font-weight: 700; }
    .results { height: 430px; overflow: auto; }
    .result { padding: 13px 15px; border-bottom: 1px solid #e8ebe6; }
    .result:last-child { border-bottom: 0; }
    .result a { color: #225f49; font-weight: 700; text-decoration: none; line-height: 1.5; }
    .result a:hover { text-decoration: underline; }
    .result-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .result-summary { color: #464c46; line-height: 1.55; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .log { height: 430px; overflow: auto; padding: 12px 14px; background: #20231f; color: #dfe6de; font: 12px/1.7 Consolas, monospace; }
    .log-line { display: grid; grid-template-columns: 65px 1fr; gap: 8px; }
    .log-time { color: #8da397; }
    .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
    .run-table { width: 100%; border-collapse: collapse; }
    .run-table th, .run-table td { padding: 10px 12px; border-bottom: 1px solid #e7eae5; text-align: left; }
    .run-table th { color: var(--muted); font-size: 12px; font-weight: 600; background: #fafbf9; position: sticky; top: 0; }
    .status { font-weight: 700; }
    .status.completed { color: var(--green); }
    .status.partial { color: var(--amber); }
    .status.failed { color: var(--red); }
    .toast { position: fixed; right: 22px; bottom: 22px; max-width: min(420px, calc(100vw - 44px)); padding: 11px 14px; border-radius: 5px; color: white; background: #323732; box-shadow: 0 8px 25px rgba(0,0,0,.2); display: none; }
    @media (max-width: 980px) {
      .source-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      main { padding: 18px 14px 36px; }
      .collect-band { grid-template-columns: 1fr; }
      .source-grid { grid-template-columns: 1fr; }
      .primary { width: 100%; }
      .run-table th:nth-child(4), .run-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">情报采集控制台</div>
    <div class="health" id="health">正在连接</div>
  </header>
  <main>
    <section class="collect-band">
      <div>
        <label for="moduleSelect">业务模块</label>
        <select id="moduleSelect"></select>
      </div>
      <div>
        <label for="query" id="queryLabel">主题或关键词</label>
        <input id="query" type="text" maxlength="255" placeholder="例如：F-22、f22、猛禽战斗机" autocomplete="off">
      </div>
      <button class="primary" id="collectBtn" type="button">开始采集</button>
    </section>

    <div class="section-head">
      <h2>采集源</h2>
      <span class="save-state" id="saveState">修改后自动保存</span>
    </div>
    <section class="source-grid" id="sourceGrid"><div class="empty">正在读取来源</div></section>

    <section class="workspace">
      <div class="panel">
        <div class="panel-title">
          <strong>采集结果</strong>
          <div class="tabs" id="resultTabs"></div>
        </div>
        <div class="results" id="results"><div class="empty">选择来源查看数据</div></div>
      </div>
      <div class="panel">
        <div class="panel-title"><strong>实时日志</strong><span class="hint" id="jobState">空闲</span></div>
        <div class="log" id="log"><div class="empty">开始任务后显示进度</div></div>
      </div>
    </section>

    <div class="section-head"><h2>任务记录</h2><button class="secondary" id="refreshRuns" type="button">刷新</button></div>
    <section class="panel" style="overflow:auto; max-height:330px">
      <table class="run-table">
        <thead><tr><th>任务</th><th>主题</th><th>状态</th><th>获取 / 新增</th><th>开始时间</th></tr></thead>
        <tbody id="runs"><tr><td colspan="5" class="empty">暂无任务</td></tr></tbody>
      </table>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const state = { modules: [], sources: [], activeModule: 'news', activeSource: '', activeJob: '', timer: null };
    const $ = id => document.getElementById(id);

    async function api(path, options = {}) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    function toast(message) {
      const node = $('toast');
      node.textContent = message;
      node.style.display = 'block';
      clearTimeout(node._timer);
      node._timer = setTimeout(() => node.style.display = 'none', 3200);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function sourceConfigFields(source) {
      return Object.entries(source.configurable || {}).map(([key, spec]) => {
        const value = source.config?.[key] ?? spec.default;
        if (spec.type === 'boolean') {
          return `<label class="switch" title="${escapeHtml(spec.label)}"><input data-config="${key}" type="checkbox" ${value ? 'checked' : ''}><span></span></label>`;
        }
        const options = (spec.options || []).map(option => `<option ${option === value ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('');
        return `<div><label>${escapeHtml(spec.label)}</label><select data-config="${key}">${options}</select></div>`;
      }).join('');
    }

    async function loadModules() {
      const data = await api('/api/modules');
      state.modules = data.modules;
      $('moduleSelect').innerHTML = data.modules.map(module =>
        `<option value="${escapeHtml(module.name)}">${escapeHtml(module.label)}</option>`
      ).join('');
      if (!data.modules.some(module => module.name === state.activeModule) && data.modules.length) {
        state.activeModule = data.modules[0].name;
      }
      $('moduleSelect').value = state.activeModule;
      updateModuleCopy();
    }

    function updateModuleCopy() {
      const module = state.modules.find(item => item.name === state.activeModule);
      if (!module) return;
      $('queryLabel').textContent = module.query_label;
      $('query').placeholder = module.name === 'news' ? '例如：F-22、f22、猛禽战斗机' : `输入${module.query_label}`;
    }

    async function loadSources() {
      const data = await api(`/api/sources?module=${encodeURIComponent(state.activeModule)}`);
      state.sources = data.sources;
      state.activeSource = data.sources.some(source => source.name === state.activeSource) ? state.activeSource : '';
      $('health').textContent = `${state.modules.length} 个模块 · ${data.sources.length} 个当前来源`;
      $('sourceGrid').innerHTML = data.sources.length ? data.sources.map(source => `
        <article class="source" data-source="${source.name}">
          <div class="source-top">
            <div class="source-name">${escapeHtml(source.label)}</div>
            <label class="switch" title="启用或停用"><input data-enabled type="checkbox" ${source.enabled ? 'checked' : ''}><span></span></label>
          </div>
          <div class="source-table">${escapeHtml(source.table_name)}</div>
          <div class="source-fields">
            <div><label>每次采集上限</label><input data-limit type="number" min="1" max="500" value="${source.item_limit}"></div>
            ${sourceConfigFields(source)}
          </div>
        </article>`).join('') : '<div class="empty">该模块尚未接入采集源</div>';
      $('resultTabs').innerHTML = data.sources.map(source => `<button class="tab" data-tab="${source.name}" type="button">${escapeHtml(source.label)}</button>`).join('');
      $('sourceGrid').querySelectorAll('input,select').forEach(control => control.addEventListener('change', saveSource));
      $('resultTabs').querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => selectSource(button.dataset.tab)));
      if (!state.activeSource && data.sources.length) selectSource(data.sources[0].name);
      if (!data.sources.length) $('results').innerHTML = '<div class="empty">接入来源后将在这里显示数据</div>';
      $('collectBtn').disabled = !data.sources.length;
      if (Object.keys(data.plugin_errors || {}).length) toast('部分插件加载失败，请检查服务日志');
    }

    async function saveSource(event) {
      const article = event.target.closest('[data-source]');
      const source = state.sources.find(item => item.name === article.dataset.source);
      const config = {};
      article.querySelectorAll('[data-config]').forEach(input => config[input.dataset.config] = input.type === 'checkbox' ? input.checked : input.value);
      $('saveState').textContent = '正在保存';
      try {
        await api(`/api/sources/${source.name}`, {
          method: 'PUT',
          body: JSON.stringify({ enabled: article.querySelector('[data-enabled]').checked, item_limit: Number(article.querySelector('[data-limit]').value), config })
        });
        $('saveState').textContent = '已保存，即时生效';
      } catch (error) {
        $('saveState').textContent = '保存失败';
        toast(error.message);
      }
    }

    async function selectSource(name) {
      state.activeSource = name;
      document.querySelectorAll('[data-tab]').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
      $('results').innerHTML = '<div class="empty">正在读取</div>';
      try {
        const data = await api(`/api/items?source=${encodeURIComponent(name)}&limit=80`);
        $('results').innerHTML = data.items.length ? data.items.map(item => `
          <article class="result">
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
            <div class="result-meta">${escapeHtml(item.publisher || '')} · ${escapeHtml((item.matched_queries || []).join('、'))} · ${escapeHtml(item.published_at || item.last_seen_at || '')}</div>
            <div class="result-summary">${escapeHtml(item.summary || item.content || '无摘要')}</div>
          </article>`).join('') : '<div class="empty">该来源暂无数据</div>';
      } catch (error) {
        $('results').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    async function startCollection() {
      const query = $('query').value.trim();
      if (!query) { toast('请输入装备或主题'); $('query').focus(); return; }
      $('collectBtn').disabled = true;
      $('collectBtn').textContent = '采集中';
      $('log').innerHTML = '';
      try {
        const data = await api('/api/collect', { method: 'POST', body: JSON.stringify({ query, module: state.activeModule, mode: 'search' }) });
        state.activeJob = data.job_id;
        pollJob();
      } catch (error) {
        finishPolling();
        toast(error.message);
      }
    }

    async function pollJob() {
      if (!state.activeJob) return;
      try {
        const job = await api(`/api/jobs/${state.activeJob}`);
        $('jobState').textContent = job.status;
        $('log').innerHTML = job.logs.length ? job.logs.map(line => `<div class="log-line"><span class="log-time">${escapeHtml(line.time)}</span><span>${escapeHtml(line.message)}</span></div>`).join('') : '<div class="empty">任务正在启动</div>';
        $('log').scrollTop = $('log').scrollHeight;
        if (['completed', 'partial', 'failed', 'stopped'].includes(job.status)) {
          finishPolling();
          await Promise.all([loadRuns(), selectSource(state.activeSource)]);
          toast(`采集结束：${job.status}`);
          return;
        }
      } catch (error) {
        finishPolling();
        toast(error.message);
        return;
      }
      state.timer = setTimeout(pollJob, 1000);
    }

    function finishPolling() {
      clearTimeout(state.timer);
      state.activeJob = '';
      $('collectBtn').disabled = false;
      $('collectBtn').textContent = '开始采集';
    }

    async function loadRuns() {
      try {
        const data = await api(`/api/runs?limit=40&module=${encodeURIComponent(state.activeModule)}`);
        $('runs').innerHTML = data.runs.length ? data.runs.map(run => `<tr>
          <td>#${run.id}</td><td>${escapeHtml(run.query_text)}</td>
          <td class="status ${escapeHtml(run.status)}">${escapeHtml(run.status)}</td>
          <td>${run.total_fetched} / ${run.total_inserted}</td><td>${escapeHtml(run.started_at)}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="empty">暂无任务</td></tr>';
      } catch (error) { toast(error.message); }
    }

    $('collectBtn').addEventListener('click', startCollection);
    $('moduleSelect').addEventListener('change', async event => {
      state.activeModule = event.target.value;
      state.activeSource = '';
      updateModuleCopy();
      await Promise.all([loadSources(), loadRuns()]);
    });
    $('query').addEventListener('keydown', event => { if (event.key === 'Enter') startCollection(); });
    $('refreshRuns').addEventListener('click', loadRuns);
    loadModules().then(() => Promise.all([loadSources(), loadRuns()])).catch(error => { $('health').textContent = '连接失败'; toast(error.message); });
  </script>
</body>
</html>
