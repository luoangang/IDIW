  <h1>数字经济背景下制造业企业韧性提升路径研究</h1>
  <div class="info">作者：张三，李四</div>
  <span id="LbZY">本文基于二〇一五至二〇二四年制造业上市公司样本，考察数字经济渗透对企业组织韧性的影响机制。研究发现，数字技术应用通过缓解融资约束与优化供应链协同两条渠道显著提升企业韧性；这一效应在民营企业与高竞争行业中更为明显。进一步分析表明，数字基础设施水平对上述关系具有正向调节作用。研究结论为制造业数字化转型政策设计提供了经验证据。</span>
  <div class="keywords">关键词：数字经济；企业韧性；供应链协同</div>
</div>
