<title>考虑道路附着系数的智能车辆主动避撞</title>
<meta name="citation_abstract" content="针对道路附着系数变化条件下智能车辆主动避撞控制精度下降的问题，提出一种融合路面附着系数估计与模型预测控制的主动避撞方法。首先建立七自由度车辆动力学模型，利用容积卡尔曼滤波对附着系数进行在线估计；其次设计自适应模型预测控制器，根据估计结果动态调整预测时域与权重矩阵；最后在联合仿真平台上开展干沥青、湿滑与冰雪三种路面工况试验。结果表明，所提方法能够将避撞距离误差控制在百分之五以内，显著优于固定参数控制器。">
<meta name="description" content="过短的站点描述">
