{"@context":"https://schema.org","@type":"ScholarlyArticle","name":"数据要素权利配置中的权利堆叠困境及其破解","abstract":"数据要素在流通与利用过程中形成了复杂的权利堆叠结构，既有的所有权进路难以回应价值释放的现实需求。本文从权利束理论出发，梳理数据来源者、数据处理者与数据使用者之间的权利关系，指出当前规则体系存在权能边界模糊、行使规则缺位与救济机制不足三重困境。在此基础上提出以场景化配置为核心的制度方案，通过分层确权、动态授权与收益共享机制实现多元主体之间的利益平衡，为数据基础制度建设提供参考。"}
