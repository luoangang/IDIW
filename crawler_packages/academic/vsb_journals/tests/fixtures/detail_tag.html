  <h2>数字孪生驱动的城市轨道交通运维决策</h2>
  <p>【摘要】面向城市轨道交通运维决策对实时性与整体性的双重要求，提出数字孪生驱动的运维决策框架。该框架融合设备状态监测、客流仿真与应急推演三类模型，在虚拟空间中同步映射线路运行状态，并通过情景推演生成维修与调度方案。案例应用表明，框架能够缩短故障响应时间并降低非计划停运影响范围。关键词：数字孪生；轨道交通；运维决策</p>
