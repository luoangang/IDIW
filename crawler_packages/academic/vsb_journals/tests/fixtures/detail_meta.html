<meta name="description" content="为揭示喀斯特峰丛洼地土壤水分运移规律，本文基于连续三年的原位观测数据，分析不同坡位与植被类型下土壤含水量的时空变化特征。结果表明，坡位对土壤水分的影响显著高于植被类型，雨季表层水分变异系数明显大于旱季；植被恢复措施能够提升深层土壤水分储量并降低极端干旱期的水分亏缺程度。研究可为喀斯特地区生态修复与水资源管理提供依据。">
