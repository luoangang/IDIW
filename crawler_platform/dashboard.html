<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>爬虫工具包平台</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #17212b; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #16324a; color: white; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0; }
    header span { color: #b9ccda; font-size: 13px; }
    main { max-width: 1280px; margin: 0 auto; padding: 26px 28px 48px; }
    section { margin-bottom: 30px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; }
    label { display: grid; gap: 5px; color: #536170; font-size: 12px; }
    input, select { min-height: 36px; border: 1px solid #b8c2cc; border-radius: 5px; padding: 7px 10px; background: white; color: #17212b; }
    input[type=file] { padding: 5px; }
    button { min-height: 36px; border: 0; border-radius: 5px; padding: 7px 13px; background: #176b5b; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #365d7d; }
    button:disabled { opacity: .45; cursor: wait; }
    table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #d4dbe2; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e1e6eb; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #e9edf1; color: #435160; font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    .status { display: inline-block; padding: 3px 7px; border-radius: 4px; background: #e5eaee; font-size: 12px; }
    .ready, .completed { color: #096443; background: #dff3e9; }
    .running, .queued { color: #805400; background: #fff0c7; }
    .failed, .partial { color: #9a2d28; background: #f9dfdd; }
    .packages { display: flex; flex-wrap: wrap; gap: 8px 18px; min-height: 36px; align-items: center; }
    .packages label { display: flex; grid: none; align-items: center; gap: 5px; font-size: 13px; color: #263441; }
    .notice { min-height: 24px; color: #315a73; font-size: 13px; margin: 8px 0; }
    .empty { color: #7c8894; }
    @media (max-width: 760px) { header { padding: 18px; } main { padding: 20px 14px; } .scroll { overflow-x: auto; } table { min-width: 760px; } }
  </style>
</head>
<body>
  <header><h1>爬虫工具包平台</h1><span id="health">正在连接</span></header>
  <main>
    <section>
      <h2>工具包</h2>
      <form id="importForm" class="toolbar">
        <label>导入 ZIP 工具包<input id="packageFile" type="file" accept=".zip" required></label>
        <button type="submit">导入</button>
      </form>
      <div class="notice" id="importNotice"></div>
      <div class="scroll"><table><thead><tr><th>名称</th><th>标识</th><th>分类</th><th>版本</th><th>结果表</th><th>状态</th></tr></thead><tbody id="packageRows"></tbody></table></div>
    </section>
    <section>
      <h2>创建监控任务</h2>
      <form id="monitorForm">
        <div class="toolbar">
          <label>任务名称<input id="monitorName" required placeholder="人工智能监控"></label>
          <label>关键词<input id="monitorQuery" required placeholder="人工智能"></label>
        </div>
        <div class="packages" id="packageChoices"></div>
        <div class="notice" id="monitorNotice"></div>
        <button type="submit">创建任务</button>
      </form>
    </section>
    <section>
      <h2>监控任务</h2>
      <div class="scroll"><table><thead><tr><th>ID</th><th>名称</th><th>关键词</th><th>计划</th><th>状态</th><th>操作</th></tr></thead><tbody id="monitorRows"></tbody></table></div>
    </section>
    <section>
      <h2>最近运行</h2>
      <div class="scroll"><table><thead><tr><th>ID</th><th>任务</th><th>状态</th><th>获取</th><th>新增</th><th>更新</th><th>未变化</th><th>开始时间</th></tr></thead><tbody id="runRows"></tbody></table></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const status = value => `<span class="status ${escapeHtml(value)}">${escapeHtml(value)}</span>`;
    async function api(path, options={}) {
      const response = await fetch(path, options);
      const value = await response.json();
      if (!response.ok) throw new Error(value.message || value.error || `HTTP ${response.status}`);
      return value;
    }
    async function refresh() {
      const [packages, monitors, runs] = await Promise.all([api('/api/v1/packages'), api('/api/v1/monitors'), api('/api/v1/runs')]);
      $('health').textContent = `已连接 · ${packages.length} 个工具包`;
      $('packageRows').innerHTML = packages.map(row => `<tr><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.package_key)}</td><td>${escapeHtml(row.category)}</td><td>${escapeHtml(row.active_version)}</td><td>${escapeHtml(row.table_name)}</td><td>${status(row.status)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">尚未导入工具包</td></tr>';
      $('packageChoices').innerHTML = packages.filter(row => row.status === 'ready').map(row => `<label><input type="checkbox" name="package" value="${escapeHtml(row.package_key)}" checked>${escapeHtml(row.name)}</label>`).join('');
      $('monitorRows').innerHTML = monitors.map(row => `<tr><td>${row.id}</td><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.query_text)}</td><td>${escapeHtml(row.schedule_type)}</td><td>${row.enabled ? status('ready') : status('disabled')}</td><td><button class="secondary" onclick="runMonitor(${row.id},this)">立即运行</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">尚未创建监控任务</td></tr>';
      $('runRows').innerHTML = runs.map(row => `<tr><td>${row.id}</td><td>${escapeHtml(row.monitor_name)}</td><td>${status(row.status)}</td><td>${row.fetched}</td><td>${row.inserted}</td><td>${row.updated}</td><td>${row.unchanged}</td><td>${escapeHtml(row.started_at || row.created_at)}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">暂无运行记录</td></tr>';
    }
    async function runMonitor(id, button) {
      button.disabled = true;
      try { const value = await api(`/api/v1/monitors/${id}/runs`, {method:'POST'}); $('monitorNotice').textContent = `任务已进入队列，运行编号 ${value.run_id}`; await refresh(); }
      catch (error) { $('monitorNotice').textContent = error.message; }
      finally { button.disabled = false; }
    }
    $('monitorForm').addEventListener('submit', async event => {
      event.preventDefault();
      const keys = [...document.querySelectorAll('input[name=package]:checked')].map(input => input.value);
      try {
        const value = await api('/api/v1/monitors', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('monitorName').value,query:$('monitorQuery').value,package_keys:keys,schedule_type:'manual'})});
        $('monitorNotice').textContent = `任务 #${value.id} 已创建`;
        event.target.reset(); await refresh();
      } catch (error) { $('monitorNotice').textContent = error.message; }
    });
    $('importForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(); form.append('package', $('packageFile').files[0]);
      try { const value = await api('/api/v1/packages/import', {method:'POST',body:form}); $('importNotice').textContent = `${value.package_key} ${value.version} 已导入`; event.target.reset(); await refresh(); }
      catch (error) { $('importNotice').textContent = error.message; }
    });
    refresh().catch(error => $('health').textContent = `连接失败：${error.message}`);
    setInterval(() => refresh().catch(() => {}), 5000);
  </script>
</body>
</html>
